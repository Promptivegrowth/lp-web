<div class="lightbox" role="dialog" aria-modal="true" aria-label="Galería de fotos" aria-hidden="true">
  <button class="lightbox__btn lightbox__cerrar" type="button" aria-label="Cerrar galería">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
  </button>
  <button class="lightbox__btn lightbox__prev" type="button" aria-label="Foto anterior">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
  <button class="lightbox__btn lightbox__sig" type="button" aria-label="Foto siguiente">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <figure class="lightbox__figura">
    <img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" />
    <figcaption></figcaption>
  </figure>

  <span class="lightbox__contador">01 / 16</span>
</div>
